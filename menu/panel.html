<!--
  =========================================================
  PANEL EN VIVO (para el negocio) · Kenmake Soluciones
  ---------------------------------------------------------
  - Los pedidos del menú entran solos (Firebase), con sonido.
  - Se entra con correo y contraseña (los crea Kengis en la consola de Firebase).
  - Pensado para el celular de la cocina: queda abierto y la pantalla no se apaga.
  - Si algún día falla internet, el panel viejo de "pegar pedido" sigue en menu/aviso.html.

  Para cambiar algo, busca con Ctrl+F:
  @@DELIVERYS     Correos de los delivery: entran a una pantalla solo de entregas
  @@AGOTADOS      Botón "Agotados": marcar lo que no hay hoy (los productos salen solos del menú)
  @@MINUTOS       Opciones del tiempo de preparación (máximo 50)
  @@AVISOS-WHATSAPP  Abrir o no WhatsApp en cada paso (apagado: todo en la app)
  @@MENSAJES      Mensajes que se le mandan al cliente por WhatsApp
  @@DELIVERY-MSG  Mensaje para el grupo de delivery
  @@SONIDO        Sonido de pedido nuevo
  @@COLORES       Colores
  =========================================================
-->
<style>
/* @@COLORES */

body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#2A0E10 0%,var(--fondo) 55%);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;font-size:17px}
.caja{max-width:620px;margin:0 auto;padding:16px 14px 60px}

.cab small{display:flex;align-items:center;gap:6px;color:var(--suave);font-size:14px}

.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}

.pedido{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--tarjeta);border:1px solid var(--borde);color:inherit;margin-bottom:10px}
.pedido.nuevo{border-color:var(--rojo);background:#2A0E10;animation:latir 1.4s ease-in-out infinite}

.pedido .tiempo{display:block;margin-top:2px;font-size:13px;font-weight:800;color:var(--amarillo);font-variant-numeric:tabular-nums}

.est.nuevo{background:var(--rojo);color:#fff}.est.preparando{background:#3A2A0A;color:var(--amarillo)}
.est.listo,.est.en_camino{background:#0F2A3A;color:#8FD3FF}.est.entregado{background:#132219;color:var(--verde-claro)}.est.rechazado{background:#222;color:#888}

.reloj{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:#2A0E10;border:1px solid #5E1A1E;margin-bottom:14px}

.login{max-width:380px;margin:12vh auto 0;text-align:center}

/* @@BREAK-ESTILO y @@MINUTOS-EXTRA */
.herramientas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-4px 0 14px}

.archivar-rapido{display:block;width:100%;height:42px;border:1px solid var(--borde,#333);border-top:0;border-radius:0 0 16px 16px;background:#161616;color:#D6D1CB;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer}

.reg-fechas input{min-height:44px}.reg-fechas .btn{min-height:44px;width:auto;padding:0 18px}
.reg-dia{border:1px solid var(--borde,#333);border-radius:16px;margin-bottom:8px;overflow:hidden;background:#141414}
.reg-cab{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}

.reg-fila span{display:flex;flex-direction:column;min-width:0}.reg-fila small{color:#9A958F}

.fila-adm.fila-prod{flex-direction:column;align-items:stretch;gap:8px}.fila-prod .adm-precio{justify-content:flex-start}.fila-adm small{color:#9A958F;font-size:12.5px}
.adm-precio{display:flex;gap:6px;align-items:center;flex:none}.adm-precio input{width:86px;min-height:40px;padding:0 8px;text-align:right}
.adm-editar{padding:10px 12px 14px;border-bottom:1px solid #222;display:flex;flex-direction:column;gap:8px}.adm-editar label,.adm-campo{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#B5B1AD;margin-bottom:8px}

.chico.cerrado{background:#3A0F0F;border-color:#8A2A2A;color:#FF9A9A}
.banda-break.banda-cierre{background:#3A0F0F;border-color:#8A2A2A;color:#FFB4B4}.banda-break.banda-cierre small{color:#F2B8B8}.banda-break.banda-cierre button{border-color:#8A2A2A;background:#1F0707;color:#FFB4B4}
.chico.on{background:#3A2A08;border-color:#8A6A1A;color:#FFD27A}

.banda-break button{border:1px solid #8A6A1A;background:#1A1405;color:#FFD27A;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px}
.extra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.extra span{color:var(--suave);font-size:14px;margin-right:4px}
.extra button{border:1px solid var(--borde);background:var(--tarjeta);color:var(--texto);border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px}
/* @@CHAT-ESTILO y @@ARCHIVAR */
.pchat{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto}
.pm{max-width:82%;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.pm.cliente{align-self:flex-start;background:#26262A;border-bottom-left-radius:4px}
.pm.negocio{align-self:flex-end;background:var(--rojo);color:#fff;border-bottom-right-radius:4px}

.pvacio{color:var(--suave);font-size:14px;text-align:center;padding:10px}
.pchat-rapido{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px}
.pchat-rapido button{flex:none;border:1px solid var(--borde);background:var(--tarjeta);color:var(--texto);border-radius:999px;padding:8px 12px;font-size:13.5px}

.ncomp{display:inline-block;white-space:nowrap;align-self:flex-start;background:#3A2A08;color:#FFD27A;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;margin:3px 0}

.caja-pago{margin-top:14px;padding:14px;border-radius:16px;background:#2A2410;border:1px solid #8A6A1A}
.caja-pago.ok{background:#0F2A1A;border-color:#1F6B3E}
.caja-pago img{display:block;width:100%;max-height:380px;object-fit:contain;border-radius:12px;background:#000}
.nmsj{display:inline-block;align-self:flex-start;background:var(--rojo);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;margin:3px 0}
.nprueba{display:inline-block;background:#333;color:#bbb;border-radius:999px;padding:1px 8px;font-size:12px;margin-left:4px}
/* @@LOGIN-ESTILO */
.check-recordar{display:flex;align-items:center;gap:10px;margin:12px 0 4px;color:var(--suave);font-size:14.5px}

.lista-p{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;overflow:hidden;margin-bottom:8px}

<body>
<div class="caja" id="app"><p class="vacio">Cargando…</p></div>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script type="module">
import { entrar, salir, alCambiarSesion, escucharPedidosDeHoy, actualizarPedido, enMinutos, escucharDisponibilidad, guardarAgotados, marcarAgotado, guardarBreak, guardarCierre, guardarMantenimiento, guardarHorarioHoy, guardarAdmin, ocultarProducto, escucharChat, enviarMensaje, diaDeHoy, buscarPedidos, tokenSesion } from "./fb.js";

const NEGOCIO = { nombre: "Jireh Sushi" };
/* @@DELIVERYS — correos de los repartidores (en minúscula). Al entrar con uno de estos,
   el panel muestra SOLO las entregas: pedidos de delivery listos para salir, en camino y entregados.
   Para agregar otro delivery: créalo en Firebase → Authentication y pon su correo aquí, separado por coma. */
const DELIVERYS = ["delivery@jirehsushi.com"];
/* @@AVISOS-WHATSAPP — false = todo se queda en la app: el panel NO abre WhatsApp en cada paso
   (aceptar, listo, en camino, rechazar, pago). El cliente ve cada cambio en vivo en "Ver mi pedido".
   Para hablar con un cliente (retraso, pregunta) están los botones 💬 WhatsApp y 📞 Llamar.
   true = vuelve a abrir WhatsApp con el mensaje listo en cada paso. */
const AVISOS_WA = false;
/* @@MINUTOS */
const MINUTOS = [10, 15, 20, 25, 30, 35, 40, 50];
/* @@MENSAJES — {nombre}, {id}, {min} y {enlace} se rellenan solos */
const MSG = {
  aceptado: "¡Hola {nombre}! 🍣 Recibimos tu pedido #{id}. Estará listo en aproximadamente {min} minutos.\n\n⏱️ Síguelo en vivo aquí: {enlace}",
  listoLlevar: "¡{nombre}, tu pedido #{id} está listo! 🙌 Puedes pasar a buscarlo.",
  enCamino: "¡{nombre}, tu pedido #{id} va en camino! 🛵",
  pago: "¡Gracias {nombre}! Recibimos tu pago del pedido #{id} ✅",
  gracias: "¡Gracias por tu compra, {nombre}! Esperamos que lo disfrutes 🍣 ¡Te esperamos pronto en Jireh Sushi!",
  rechazado: "Hola {nombre}, lo sentimos mucho: no podemos preparar tu pedido #{id} en este momento. {motivo}"
};
const ESTADOS = { nuevo: "Nuevo", preparando: "En cocina", listo: "Listo", en_camino: "En camino", entregado: "Entregado", rechazado: "Rechazado" };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const dinero = n => "RD$ " + Number(n || 0).toLocaleString("en-US");
const ms = t => t && t.toMillis ? t.toMillis() : (t || 0);
const hora = t => ms(t) ? new Date(ms(t)).toLocaleTimeString("es-DO", { hour: "numeric", minute: "2-digit" }) : "";
const mmss = x => { const s = Math.max(0, Math.round(x / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
function avisar(t){ const a = $("#aviso"); a.textContent = t; a.classList.add("ver"); clearTimeout(avisar.t); avisar.t = setTimeout(() => a.classList.remove("ver"), 2400); }
function telWA(t){ let n = String(t).replace(/\D/g, ""); if (n.length === 10) n = "1" + n; return n; }
// Abre WhatsApp en otra pestaña para que el panel siga abierto y escuchando pedidos
function abrirWA(numero, texto){
  const movil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const url = `${movil ? "https://api.whatsapp.com/send" : "https://web.whatsapp.com/send"}?${numero ? "phone=" + numero + "&" : ""}text=${encodeURIComponent(texto)}`;
  if (!window.open(url, "_blank")) location.href = url;
}
const enlaceSeguimiento = id => new URL("pedido.html?id=" + encodeURIComponent(id), location.href).href;
const llenar = (t, p, extra = {}) => t.replace(/\{nombre\}/g, (p.nombre || "").split(/\s+/)[0]).replace(/\{id\}/g, p.codigo)
  .replace(/\{min\}/g, extra.min ?? p.minutos ?? "").replace(/\{enlace\}/g, enlaceSeguimiento(p.id)).replace(/\{motivo\}/g, extra.motivo || "");

/* ---------- Estado de la pantalla ---------- */
let rol = "cocina", usuarioActual = "", pausa = null, eligiendoBreak = false;
let cierre = null, confirmandoCierre = false, eliminandoTodos = false, rechazando = null;
let mant = null, confirmandoMant = false, borrando = null;   // @@MANTENIMIENTO
let horarioHoy = null, editandoHorario = false;   // @@HORARIO-HOY

function kmHasta(pt){ const R = 6371, r = x => x * Math.PI / 180, dLa = r(pt.lat - LOCAL.lat), dLo = r(pt.lng - LOCAL.lng);
  const h = Math.sin(dLa/2) ** 2 + Math.cos(r(LOCAL.lat)) * Math.cos(r(pt.lat)) * Math.sin(dLo/2) ** 2; return Math.max(1, Math.ceil(2 * R * Math.asin(Math.sqrt(h)) * FACTOR)); }
function ubicDelChat(id){   // última ubicación que el cliente mandó por el chat (botón "Mi ubicación")

  return m ? { lat: +m[1], lng: +m[2] } : null;
}        // @@MINUTOS-EXTRA  botones para dar más tiempo a un pedido en cocina

function campana(){
  if (!audio) return;
  const t = audio.currentTime;
  [[880, 0], [1175, .18], [1568, .36]].forEach(([f, d]) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(.35, t + d + .02); g.gain.exponentialRampToValueAtTime(.001, t + d + .6);
    o.start(t + d); o.stop(t + d + .65);
  });
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

  suscribirPedidos = () => {

    /* @@PRUEBAS-APARTE: los pedidos de prueba (marcados 🧪 o con "prueba" en el nombre del cliente) solo los ve la cuenta de Kengis.

    lista.forEach(marcarPrueba);

function escucharChats(){
  if (rol === "delivery") return;
  pedidos.filter(p => !p.archivado).forEach(p => {
    if (chatsOff[p.id]) return;
    chatsOff[p.id] = escucharChat(p.id, lista => {
      if (!lista) return;
      const antes = (chats[p.id] || []).filter(m => m.de === "cliente").length;
      chats[p.id] = lista;
      const ahora = lista.filter(m => m.de === "cliente").length;
      if (chatsCargados[p.id] && ahora > antes) {
        const u = lista.filter(m => m.de === "cliente").pop();
        if (!CHAT_ACTIVO) { if (u.foto) { campana(); avisar(`🧾 Llegó el comprobante de ${p.nombre} (#${p.codigo})`); notificar(`🧾 #${p.codigo} · ${p.nombre}`, "Llegó el comprobante de la transferencia", "c-" + p.id); } }
        else {
        campana(); avisar(`💬 Mensaje de ${p.nombre} (#${p.codigo})`);
        notificar(`💬 #${p.codigo} · ${p.nombre}`, u.foto ? "📷 Envió una foto" + (u.texto ? ": " + u.texto : "") : u.texto, "chat-" + p.id);
        }

  });
}

function fijarDelivery(p, monto, km){
  monto = Math.round(+monto); if (!(monto >= 0)) return;
  const sub = p.subtotal != null ? p.subtotal : (p.total || 0);
  const total = sub + monto, cambios = { delivery: monto, total, totalTexto: dinero(total) };
  if (km) cambios.km = +km;
  editandoDelivery = null;
  cambiar(p, cambios, null, `Delivery ${dinero(monto)} · total ${dinero(total)}`);
  if (CHAT_ACTIVO) responder(p, `El delivery a tu ubicación es ${dinero(monto)}. Total a pagar: ${dinero(total)}.${p.pago === "Transferencia" ? " Puedes transferir ese monto y mandarnos el comprobante por aquí." : ""}`);
}
async function responder(p, texto){
  if (!texto.trim()) return;
  try { await enviarMensaje(p.id, "negocio", texto.trim()); } catch(e) { avisar("No se pudo enviar. Revisa el internet."); }
}

  salida: p => !p.archivado && ["listo", "en_camino"].includes(p.estado),
  entregado: p => !p.archivado && ["entregado", "rechazado"].includes(p.estado),
  archivados: p => !!p.archivado && (!p.eliminado || esSuper())   // @@ELIMINAR: "eliminado" no se ve (sigue contando en las ventas). La cuenta de Kengis sí los ve, para marcar sus pruebas
};
/* Botones de arriba (Agotados, Registro, Break, Cerrar por hoy). El delivery ve Break y Cerrar por hoy. */
function herramientasHTML(cocina){
  return `
    <div class="herramientas">

      ${cocina ? `<button class="chico${horarioDeHoy() ? " on" : ""}" data-acc="horario-hoy">🕐 ${horarioDeHoy() ? "Hoy: " + hora12(horarioDeHoy().abre) : "Horario de hoy"}</button>` : ""}

    ${cerradoHoy() ? `<div class="banda-break banda-cierre"><div><b>🔒 Cerrado por hoy</b><small>El menú se ve, pero los clientes no pueden enviar pedidos hasta mañana. Los pedidos que ya entraron siguen aquí.</small></div><button data-acc="reabrir">Volver a abrir</button></div>`
      : confirmandoCierre ? `<div class="banda-break banda-cierre"><div><b>¿Cerrar el negocio por hoy?</b><small>Los clientes verán "Hoy cerramos temprano" y no podrán hacer pedidos hasta mañana. Puedes volver a abrir cuando quieras.</small></div><div class="extra" style="margin:0"><button data-acc="confirmar-cierre">Sí, cerrar por hoy</button><button data-acc="cerrar-hoy">Cancelar</button></div></div>` : ""}
    ${enBreak() ? `<div class="banda-break"><div><b>En break hasta las ${horaCorta(pausa.hasta)}</b><small>Los clientes ven el aviso en el menú. Los pedidos siguen entrando.</small></div><button data-acc="fin-break">Terminar break</button></div>`
      : eligiendoBreak ? `<div class="banda-break"><div><b>¿Cuánto dura el break?</b><small>Los clientes verán: "Estamos en break, volvemos a las …"</small></div><div class="extra" style="margin:0">${MINUTOS_BREAK.map(m => `<button data-acc="ini-break" data-dur="${m}">${m} min</button>`).join("")}<button data-acc="break">Cancelar</button></div></div>` : ""}
    ${enMantenimiento() ? `<div class="banda-break banda-cierre"><div><b>🛠️ Página en mantenimiento</b><small>Los clientes ven "Estamos mejorando nuestra página" y no pueden pedir. Se quita sola a las ${new Date(mant.hasta).toLocaleTimeString("es-DO", { hour: "numeric", minute: "2-digit" })}</small></div>${cocina && esSuper() ? `<button data-acc="quitar-mant">Quitar</button>` : ""}</div>`
      : confirmandoMant ? `<div class="banda-break banda-cierre"><div><b>¿Poner la página en mantenimiento?</b><small>Úsalo solo cuando se esté arreglando la página, fuera del horario. Los clientes no podrán entrar al menú (máximo 6 horas). Tú la puedes ver con ?ver=kenmake.</small></div><div class="extra" style="margin:0"><button data-acc="confirmar-mant">Sí, poner</button><button data-acc="mantenimiento">Cancelar</button></div></div>` : ""}
    ${cocina && editandoHorario ? (() => { const h = horarioDeHoy() || HORARIO_NORMAL; return `<div class="banda-break"><div style="flex:1"><b>🕐 Horario solo para hoy</b>
      <small>Los clientes ven esta hora hoy. Mañana vuelve solo al horario normal (${hora12(HORARIO_NORMAL.abre)} – ${hora12(HORARIO_NORMAL.cierra)}).</small>
      <div class="reg-fechas" style="margin:8px 0 6px"><label>Abrimos<input type="time" id="hh-abre" value="${h.abre}"></label><label>Cerramos<input type="time" id="hh-cierra" value="${h.cierra}"></label></div>
      <div class="extra" style="margin:0"><button data-acc="guardar-horario">Guardar</button>${horarioDeHoy() ? `<button data-acc="horario-normal">Volver al normal</button>` : ""}<button data-acc="horario-hoy">Cancelar</button></div></div></div>`; })() : ""}`;
}
/* @@DEVOLUCION: pedido rechazado que se pagó por transferencia (con comprobante o marcado pagado) y todavía no se devolvió */
const debeDevolver = p => p.estado === "rechazado" && p.pago === "Transferencia" && !p.prueba && !p.reembolsado && (p.pagado || p.porDevolver || !!comprobanteDe(p) || p.porDevolver);
/* @@ARCHIVAR-RAPIDO: botón 🗂️ al lado de cada pedido terminado (entregado o rechazado) */
const conArchivar = (p, html) => ["entregado", "rechazado"].includes(p.estado) && !p.archivado && !debeDevolver(p)
  ? `<div class="con-archivar">${html}<div class="pie-acciones"><button class="archivar-rapido" data-arch="${esc(p.id)}" aria-label="Archivar pedido #${esc(p.codigo)}">🗂️ Archivar</button><button class="archivar-rapido borrar" data-borrar="${esc(p.id)}" aria-label="Eliminar pedido #${esc(p.codigo)}">${borrando === p.id ? "¿Seguro? Toca otra vez" : "🗑️ Eliminar"}</button></div></div>` : html;
function pintar(){
  if (rol === "delivery") return pintarDelivery();

  const entregados = pedidos.filter(p => p.estado === "entregado" && !p.prueba);
  const vendido = entregados.reduce((a, p) => a + (p.total || 0), 0);
  const lista = pedidos.filter(GRUPOS[filtro]);
  const cuenta = k => pedidos.filter(GRUPOS[k]).length;
  $("#app").innerHTML = `
    <div class="cab"><img src="fotos/logo.png" alt=""><div><h1>Pedidos de hoy</h1>
      <small><span class="punto ${conectado ? "on" : ""}"></span>${conectado ? "En vivo" : "Conectando…"}</small></div>
      <button class="chico" data-acc="salir">Salir</button></div>
    ${herramientasHTML(true)}
    ${sonidoListo && (avisosOK() || !("Notification" in window)) ? "" : `<button class="sonido" data-acc="sonido">🔔 Toca aquí para activar el sonido y los avisos de pedidos nuevos</button>`}
    <div class="resumen">
      <div><b>${pedidos.filter(p => p.estado !== "rechazado" && !p.prueba).length}</b><small>Pedidos</small></div>
      <div><b>${cuenta("activos")}</b><small>En curso</small></div>
      <div><b style="font-size:19px">${dinero(vendido)}</b><small>Vendido (entregados)</small></div>
    </div>
    <div class="filtros">
      ${[["activos","En curso"],["nuevo","Nuevos"],["preparando","En cocina"],["salida","Para salir"],["entregado","Terminados"],["archivados","Archivados"]]
        .map(([k, t]) => `<button class="${filtro === k ? "activo" : ""}" data-filtro="${k}">${t}<span class="n">${cuenta(k)}</span></button>`).join("")}
    </div>
    ${lista.length ? lista.map(p => conArchivar(p, `
      <button class="pedido ${p.estado === "nuevo" ? "nuevo" : ""}" data-abrir="${esc(p.id)}">
        <span class="num">#${esc(p.codigo)}</span>
        <span class="info"><b>${esc(p.nombre)}${p.prueba ? ` <span class="nprueba">prueba</span>` : ""}${p.eliminado ? ` <span class="nprueba">eliminado</span>` : ""}</b>
          ${debeDevolver(p) ? `<span class="ncomp no">💸 Devolver dinero</span>` : p.estado === "rechazado" ? "" : p.pago === "Transferencia" ? (p.pagado ? `<span class="ncomp ok">✅ Pagado</span>` : comprobanteDe(p) ? `<span class="ncomp">🧾 Revisar pago</span>` : `<span class="ncomp no">🧾 Sin comprobante</span>`) : ""}
          ${sinLeer(p.id) ? `<span class="nmsj">💬 ${sinLeer(p.id)} ${sinLeer(p.id) > 1 ? "nuevos" : "nuevo"}</span>` : ""}
          <small>${p.modo === "delivery" ? "🛵 Delivery" : "🥡 Para llevar"} · ${hora(p.creado)} · ${dinero(p.total)}</small>
          ${p.estado === "preparando" && p.listoEn ? `<span class="tiempo">⏱️ <span data-fin="${ms(p.listoEn)}">--:--</span></span>` : ""}</span>
        <span class="est ${p.estado}">${ESTADOS[p.estado] || p.estado}</span>
      </button>`)).join("")
      : ""}
    ${filtro === "entregado" && lista.length ? `<button class="btn borde" data-acc="archivar-todos" style="margin-top:6px">🗂️ Archivar todos los terminados</button>` : ""}
    ${filtro === "archivados" ? `<p class="ayuda" style="margin-top:8px">Los archivados no se ven en "En curso" ni "Terminados", pero se guardan y cuentan en las ventas del día (menos los marcados como prueba).</p>
      ${lista.length ? `<button class="btn borde" data-acc="eliminar-todos" style="margin-top:6px">🗑️ Quitar todos de la lista (siguen contando en las ventas)</button>` : ""}` : ""}
    ${lista.length ? "" : `<div class="vacio">${filtro === "activos" ? "No hay pedidos en curso.<br>Cuando un cliente pida desde el menú, aparecerá aquí con sonido 🔔" : "Nada por aquí."}</div>`}
  `;
  relojes();
}

/* ---------- Detalle de un pedido ---------- */
function itemsHTML(p){
  return (p.items || []).map(it => `<li>${it.cant} x ${esc(it.nombre)} <span style="color:var(--suave)">· ${dinero(it.precio * it.cant)}</span>
    ${(it.detalles || []).map(d => `<small class="${/^Cambio a/i.test(d) ? "cambio" : ""}">${/^Cambio a/i.test(d) ? "🔁 " : /^Extra/i.test(d) ? "➕ " : ""}${esc(d)}</small>`).join("")}</li>`).join("");
}
function mapa(p){
  if (p.ubic) return "https://maps.google.com/?q=" + p.ubic.lat + "," + p.ubic.lng;
  if (p.dir) return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.dir + ", Santo Domingo Este");
  return "";
}

  const motivoPrevio = $("#motivo") ? $("#motivo").value : "", motivoFoco = document.activeElement && document.activeElement.id === "motivo";
  marcarChat(p.id);
  let acciones = "";
  if (p.estado === "nuevo") acciones = `

      <button class="btn borde" data-acc="rechazar">No se puede preparar</button></div>

      ${p.pago === "Transferencia" ? `<p class="ayuda" style="color:var(--amarillo);margin:8px 0 0">💸 Este cliente pagó por transferencia: después de rechazar, hay que devolverle el dinero.</p>` : ""}
      <div class="botones" style="margin-top:8px"><button class="btn rojo" data-acc="confirmar-rechazo">Rechazar y avisar al cliente</button></div></div>`;

      ${entrega && AVISOS_WA ? `<button class="btn" data-acc="grupo">🛵 Mandar al grupo de delivery</button>` : ""}</div>

    <div class="botones">${entrega ? `<button class="btn rojo" data-acc="camino">📦 El delivery ya lo recogió</button>${AVISOS_WA ? `<button class="btn" data-acc="grupo">Mandar al grupo de delivery</button>` : ""}` : ""}
      <button class="btn verde" data-acc="entregado">📦 Entregado</button></div>`;
  if (p.estado === "en_camino") acciones = `<div class="botones"><button class="btn verde" data-acc="entregado">📦 Entregado</button></div>`;
  if (p.estado === "entregado" || p.estado === "rechazado") acciones = `<div class="botones"><button class="btn borde" data-acc="reabrir">Reabrir pedido</button></div>`;

  $("#app").innerHTML = `
    <button class="volver" data-acc="volver">← Pedidos de hoy</button>
    <div class="tarjeta">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <h1 style="margin:0;font-size:26px">#${esc(p.codigo)}</h1><span class="est ${p.estado}">${ESTADOS[p.estado] || p.estado}</span></div>
      <div class="fila"><span>Cliente</span><span>${esc(p.nombre)}</span></div>
      <div class="fila"><span>Teléfono</span><span>${esc(p.tel)}</span></div>
      <div class="fila"><span>Tipo</span><span>${entrega ? "🛵 Delivery" : "🥡 Para llevar"} · ${hora(p.creado)}</span></div>

/* ---------- Relojes en vivo ---------- */
function relojes(){
  document.querySelectorAll("[data-fin]").forEach(el => { const f = +el.dataset.fin - Date.now(); el.textContent = f > 0 ? mmss(f) : "¡Ya!"; });
  document.querySelectorAll("[data-reloj]").forEach(el => el.classList.toggle("tarde", +el.dataset.reloj < Date.now()));
}
setInterval(relojes, 1000);
setInterval(() => { if (pausa && !enBreak()) { pausa = null; pintar(); } if (cierre && !cerradoHoy()) { cierre = null; pintar(); } }, 30000);

/* ---------- @@VISTA-DELIVERY: pantalla de los repartidores ---------- */
const nombreUsuario = () => usuarioActual.split("@")[0].replace(/[._]/g, " ").replace(/\b\w/g, c => c.toUpperCase());
const cobrar = p => p.pago === "Transferencia"
  ? (p.pagado ? "💳 Transferencia ✅ pagado" : "💳 Transferencia · verificar")
  : (p.pagado ? "💵 Cobrado ✅" : `💵 Cobrar ${p.totalTexto || dinero(p.total)}${p.cambio ? " · paga con " + p.cambio : ""}`);
function tarjetaEntrega(p, apagado){

      <span class="tiempo" style="color:${p.pagado || p.pago === "Transferencia" ? "var(--suave)" : "var(--amarillo)"}">${esc(cobrar(p))}</span>

async function cargarCatalogo(){
  const txt = await (await fetch("index.html", { cache: "no-store" })).text();
  const a = txt.indexOf("const CAMBIO_PROTEINA"), b = txt.indexOf("/* Ilustraciones");
  const { CAMBIO_PROTEINA, SALSAS_EXTRA, MENU } = new Function(txt.slice(a, b) + "\nreturn { CAMBIO_PROTEINA, SALSAS_EXTRA, MENU };")();
  const secciones = MENU.map(sec => ({ nombre: sec.nombre, items: sec.grupos.flatMap(g => g.items).filter(p => !p.oculto && !p.salsa).map(p => ({ k: p.id, n: p.nombre })) }))
    .filter(s => s.items.length);
  secciones.push({ nombre: "Salsas y extras", items: SALSAS_EXTRA.opciones.map(o => ({ k: "salsa:" + o.nombre, n: o.nombre })) });
  secciones.push({ nombre: "Cambio de proteína", items: CAMBIO_PROTEINA.opciones.map(o => ({ k: "prot:" + o.nombre, n: "Cambio a " + o.nombre.toLowerCase() })) });
  return secciones;
}

/* ================= @@REGISTRO: ventas por día, semana o mes =================
   Busca en Firebase los pedidos entre dos fechas. Cuenta todos (también archivados y quitados de la lista),
   menos los de prueba y los rechazados. Se puede descargar en Excel (CSV). */
let reg = { desde: "", hasta: "", titulo: "", datos: null, cargando: false, error: "", abiertoDia: null };
const sumarDias = (dia, n) => { const d = new Date(dia + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const nombreDia = dia => new Date(dia + "T12:00:00Z").toLocaleDateString("es-DO", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
function periodo(cual){
  const hoy = diaDeHoy(), dow = (new Date(hoy + "T12:00:00Z").getUTCDay() + 6) % 7;   // 0 = lunes
  if (cual === "hoy") return [hoy, hoy, "Hoy"];
  if (cual === "ayer") { const a = sumarDias(hoy, -1); return [a, a, "Ayer"]; }
  if (cual === "semana") return [sumarDias(hoy, -dow), hoy, "Esta semana"];
  if (cual === "semana-pasada") return [sumarDias(hoy, -dow - 7), sumarDias(hoy, -dow - 1), "Semana pasada"];
  if (cual === "mes") return [hoy.slice(0, 8) + "01", hoy, "Este mes"];
  if (cual === "mes-pasado") { const fin = sumarDias(hoy.slice(0, 8) + "01", -1); return [fin.slice(0, 8) + "01", fin, "Mes pasado"]; }
}
async function cargarRegistro(desde, hasta, titulo){
  if (!desde || !hasta || desde > hasta) { reg.error = "Revisa las fechas: la primera tiene que ser antes que la segunda."; return pintar(); }
  reg = { ...reg, desde, hasta, titulo, cargando: true, error: "", datos: null, abiertoDia: null }; pintar();
  try { reg.datos = (await buscarPedidos(desde, hasta)).map(marcarPrueba); }
  catch(e) { console.error(e); reg.error = "No se pudo buscar. Revisa el internet."; }
  reg.cargando = false; pintar();
}

function descargarRegistro(){

        <label>Termina a las (el último día)<input id="pm-hora" type="time" value="${pr.horaFin || "20:00"}"></label></div>
      <p class="ayuda" style="margin:6px 0">¿En qué secciones? Si no marcas ninguna, es en <b>toda la carta</b>.</p>
      <div class="chips adm-secs">${menuAdmin.map(sc => `<label><input type="checkbox" class="pm-sec" value="${esc(sc.id)}" ${secs.includes(sc.id) ? "checked" : ""}> ${esc(sc.nombre)}</label>`).join("")}</div>
      <button class="btn verde" data-acc="promo-guardar" style="margin-top:12px">${activa ? "Guardar cambios" : "Activar la promoción"}</button></div>`;
  }
  $("#app").innerHTML = `
    <button class="volver" data-acc="ver-pedidos">← Pedidos de hoy</button>
    <div class="cab"><div><h1>⚙️ Administrar</h1><small>Lo que cambies aquí se ve en la página al instante. ${cambiados ? cambiados + " cambio" + (cambiados > 1 ? "s" : "") + " hecho" + (cambiados > 1 ? "s" : "") + "." : ""} Productos nuevos, fotos y diseño: escríbele a Kenmake.</small></div></div>
    <div class="filtros">${pest("precios", "💲 Precios")}${pest("productos", "🍣 Productos")}${pest("promo", "🔥 Promoción")}</div>
    ${cuerpo}`;
  const bq = $("#buscar-adm");
  if (bq) { filtrarAdm(); bq.addEventListener("input", e => { buscarAdm = e.target.value; filtrarAdm(); }); }
}
function filtrarAdm(){
  const q = buscarAdm.trim().toLowerCase();
  document.querySelectorAll(".fila-adm").forEach(f => f.hidden = !!q && !f.dataset.n.includes(q));
  document.querySelectorAll(".sec-ag").forEach(sc => sc.hidden = ![...sc.querySelectorAll(".fila-adm")].some(f => !f.hidden));
}
const guardarYAvisar = (pr, ok) => pr.then(() => avisar(ok)).catch(e => { console.error(e); avisar("No se pudo guardar. Revisa el internet."); });

function pintarAgotados(){
  if (!catalogo) {
    $("#app").innerHTML = `<p class="vacio">Cargando productos…</p>`;
    cargarCatalogo().then(c => { catalogo = c; pintar(); }).catch(() => { $("#app").innerHTML = `<button class="volver" data-acc="ver-pedidos">← Pedidos de hoy</button><p class="vacio">No se pudo cargar el menú. Revisa el internet.</p>`; });
    return;
  }
  const lista = [...agotados];
  $("#app").innerHTML = `
    <button class="volver" data-acc="ver-pedidos">← Pedidos de hoy</button>
    <div class="cab"><div><h1>Agotados</h1><small>Toca un producto para marcarlo. El menú cambia al instante y se queda así hasta que alguien lo vuelva a poner disponible.</small></div></div>
    <div class="tarjeta">
      <h2 style="margin-top:0">Agotado ahora (${lista.length})</h2>
      ${lista.length ? `<div class="chips">${lista.map(k => `<button data-k="${esc(k)}">✕ ${esc(nombreDe(k))}</button>`).join("")}</div>
        <button class="btn borde" data-acc="todo-disponible" style="margin-top:10px;min-height:48px">${seguroTodo ? "¿Seguro? Toca otra vez" : "Poner todo disponible"}</button>`
        : `<p class="ayuda" style="margin:0">Todo está disponible ✅</p>`}
    </div>
    <input id="buscar-ag" type="search" placeholder="Buscar producto…" value="${esc(buscarAg)}" style="margin-bottom:6px">
    ${catalogo.map(sec => `<div class="sec-ag"><h2>${esc(sec.nombre)}</h2><div class="lista-p">
      ${sec.items.map(it => { const off = agotados.has(it.k); return `<div class="fila-p${off ? " off" : ""}" data-n="${esc(it.n.toLowerCase())}"><span>${esc(it.n)}</span>
        <button class="sw${off ? " off" : ""}" data-k="${esc(it.k)}">${off ? "Agotado" : "Disponible"}</button></div>`; }).join("")}
    </div></div>`).join("")}`;
  filtrarAg();
  $("#buscar-ag").addEventListener("input", e => { buscarAg = e.target.value; filtrarAg(); });
}
function filtrarAg(){
  const q = buscarAg.trim().toLowerCase();
  document.querySelectorAll(".fila-p").forEach(f => f.style.display = !q || f.dataset.n.includes(q) ? "" : "none");
  document.querySelectorAll(".sec-ag").forEach(s => s.style.display = [...s.querySelectorAll(".fila-p")].some(f => f.style.display !== "none") ? "" : "none");
}
async function cambiarAgotado(k){
  const nuevo = new Set(agotados); nuevo.has(k) ? nuevo.delete(k) : nuevo.add(k);
  const quedo = nuevo.has(k);
  agotados = nuevo; pintar();
  try { await marcarAgotado(k, quedo); avisar(quedo ? `🚫 ${nombreDe(k)}: agotado` : `✅ ${nombreDe(k)}: disponible`); }
  catch (e) { console.error(e); avisar("No se pudo guardar. Revisa el internet."); }
}

/* ---------- Acciones ---------- */
async function cambiar(p, cambios, cambiosCli, texto){
  try { await actualizarPedido(p.id, cambios, cambiosCli); if (texto) avisar(texto); }
  catch (e) { console.error(e); avisar("No se pudo guardar. Revisa el internet."); }
}
/* @@DELIVERY-MSG */
function mensajeDelivery(p){
  let m = `🛵 PEDIDO #${p.codigo} · ${p.nombre}\n📞 ${p.tel}\n📍 ${p.dir}${p.ref ? "\nReferencia: " + p.ref : ""}`;
  if (mapa(p)) m += `\nMapa: ${mapa(p)}`;
  m += "\n\n" + (p.items || []).map(it => `• ${it.cant} x ${it.nombre}` + (it.detalles || []).map(d => "\n   " + d).join("")).join("\n");
  if (p.notas) m += `\nNotas: ${p.notas}`;
  m += p.pago === "Transferencia" ? `\n\n💳 Pagó por transferencia${p.pagado ? " ✅" : " (verificar comprobante)"}` : `\n\n💵 COBRAR: ${p.totalTexto || dinero(p.total)}${p.cambio ? " · paga con " + p.cambio : ""}`;
  return m + `\n\nResponde "Lo tomo ✋" si vas tú.`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-abrir]"); if (!b) return;
  activarSonido();
  if (b.dataset.k) return cambiarAgotado(b.dataset.k);
  if (b.dataset.acc === "break") { eligiendoBreak = !eligiendoBreak && !enBreak(); if (enBreak()) eligiendoBreak = false; return pintar(); }
  if (b.dataset.acc === "ini-break") {
    const hasta = Date.now() + (+b.dataset.dur) * 60000; eligiendoBreak = false;
    pausa = { hasta }; pintar();
    guardarBreak(hasta).then(() => avisar(`🍽️ Break hasta las ${horaCorta(hasta)}`)).catch(() => avisar("No se pudo guardar. Revisa el internet."));
    return;
  }
  if (b.dataset.acc === "horario-hoy") { editandoHorario = !editandoHorario; return pintar(); }   // @@HORARIO-HOY
  if (b.dataset.acc === "guardar-horario") {
    const abre = $("#hh-abre").value, cierra = $("#hh-cierra").value;
    if (!abre || !cierra || abre >= cierra) return avisar("Revisa las horas: la de abrir tiene que ser antes que la de cerrar.");
    horarioHoy = { dia: diaDeHoy(), abre, cierra }; editandoHorario = false; pintar();
    guardarHorarioHoy(horarioHoy).then(() => avisar(`🕐 Hoy: ${hora12(abre)} – ${hora12(cierra)}`)).catch(() => avisar("No se pudo guardar. Revisa el internet."));
    return;
  }
  if (b.dataset.acc === "horario-normal") {
    horarioHoy = null; editandoHorario = false; pintar();
    guardarHorarioHoy(null).then(() => avisar("🕐 Horario normal")).catch(() => avisar("No se pudo guardar. Revisa el internet."));
    return;
  }
  if (b.dataset.acc === "mantenimiento") { confirmandoMant = !confirmandoMant && !enMantenimiento(); return pintar(); }   // @@MANTENIMIENTO
  if (b.dataset.acc === "confirmar-mant") {
    const hasta = Date.now() + 6 * 3600000; confirmandoMant = false; mant = { hasta }; pintar();
    guardarMantenimiento(hasta).then(() => avisar("🛠️ Página en mantenimiento")).catch(() => avisar("No se pudo guardar. Revisa el internet."));
    return;
  }
  if (b.dataset.acc === "quitar-mant") {
    mant = null; pintar();
    guardarMantenimiento(null).then(() => avisar("✅ La página está abierta otra vez")).catch(() => avisar("No se pudo guardar. Revisa el internet."));
    return;
  }
  if (b.dataset.acc === "cerrar-hoy") { confirmandoCierre = !confirmandoCierre && !cerradoHoy(); if (cerradoHoy()) confirmandoCierre = false; return pintar(); }   // @@CERRAR-HOY
  if (b.dataset.acc === "confirmar-cierre") {
    const hasta = finDelDia(); confirmandoCierre = false; cierre = { hasta }; pintar();
    guardarCierre(hasta).then(() => avisar("🔒 Cerrado por hoy: ya no entran pedidos nuevos")).catch(() => avisar("No se pudo guardar. Revisa el internet."));
    return;
  }
  if (b.dataset.acc === "reabrir") {
    cierre = null; pintar();
    guardarCierre(null).then(() => avisar("✅ Abierto de nuevo: los clientes ya pueden pedir")).catch(() => avisar("No se pudo guardar. Revisa el internet."));
    return;
  }
  if (b.dataset.acc === "fin-break") {
    pausa = null; pintar();
    guardarBreak(null).then(() => avisar("✅ De vuelta: el aviso se quitó del menú")).catch(() => avisar("No se pudo guardar. Revisa el internet."));
    return;
  }
  if (b.dataset.resp) { const pp = pedidos.find(x => x.id === abierto); if (pp) responder(pp, b.dataset.resp); return; }
  if (b.dataset.acc === "eliminar-todos") {
    const t = pedidos.filter(GRUPOS.archivados);
    if (!eliminandoTodos) { eliminandoTodos = true; b.textContent = `¿Seguro? Toca otra vez para quitar ${t.length}`; setTimeout(() => { eliminandoTodos = false; pintar(); }, 4000); return; }
    eliminandoTodos = false;
    Promise.all(t.map(x => actualizarPedido(x.id, { eliminado: true }))).then(() => avisar(`🗑️ ${t.length} quitados (siguen contando en las ventas)`)).catch(() => avisar("No se pudo guardar. Revisa el internet."));
    return;
  }
  if (b.dataset.acc === "archivar-todos") {
    const t = pedidos.filter(GRUPOS.entregado).filter(x => !debeDevolver(x));   // los que falta devolver el dinero se quedan a la vista
    Promise.all(t.map(x => actualizarPedido(x.id, { archivado: true }))).then(() => avisar(`🗂️ ${t.length} archivados`)).catch(() => avisar("No se pudo guardar. Revisa el internet."));
    return;
  }
  if (b.dataset.acc === "ver-agotados") { vista = "agotados"; abierto = null; seguroTodo = false; window.scrollTo(0, 0); return pintar(); }
  if (b.dataset.acc === "ver-pedidos") { vista = "pedidos"; window.scrollTo(0, 0); return pintar(); }
  if (b.dataset.acc === "ver-admin") { vista = "admin"; abierto = null; editando = null; window.scrollTo(0, 0); return pintar(); }
  if (b.dataset.pest) { pestAdmin = b.dataset.pest; editando = null; return pintar(); }
  if (b.dataset.guardarPrecio) {
    const id = b.dataset.guardarPrecio, v = Math.round(Number($("#pr-" + id).value));
    const base = menuAdmin.flatMap(sc => sc.items).find(p => p.id === id);
    if (!(v > 0)) return avisar("Escribe un precio válido.");
    if (v === base.precio) { (admin.precios || {})[id] && guardarYAvisar(guardarAdmin(["precios", id], null), "Precio normal"); return; }
    return guardarYAvisar(guardarAdmin(["precios", id], v), `💲 ${base.nombre}: ${dinero(v)}`);
  }
  if (b.dataset.precioNormal) return guardarYAvisar(guardarAdmin(["precios", b.dataset.precioNormal], null), "💲 Volvió a su precio normal");
  if (b.dataset.ocultar) { const id = b.dataset.ocultar, oc = !(admin.ocultos || []).includes(id); return guardarYAvisar(ocultarProducto(id, oc), oc ? "🙈 Oculto: ya no sale en el menú" : "👀 Visible otra vez"); }
  if (b.dataset.editar) { editando = editando === b.dataset.editar ? null : b.dataset.editar; return pintar(); }
  if (b.dataset.guardarTexto) {
    const id = b.dataset.guardarTexto, base = menuAdmin.flatMap(sc => sc.items).find(p => p.id === id);
    const n = $("#ed-nombre").value.trim(), d = $("#ed-desc").value.trim(), t = {};
    if (n && n !== base.nombre) t.nombre = n; if (d && d !== base.desc) t.desc = d;
    editando = null;
    return guardarYAvisar(guardarAdmin(["textos", id], Object.keys(t).length ? t : null), "✏️ Guardado");
  }
  if (b.dataset.textoNormal) { editando = null; return guardarYAvisar(guardarAdmin(["textos", b.dataset.textoNormal], null), "Volvió al texto original"); }
  if (b.dataset.acc === "promo-guardar") {
    const promo = { activo: true, titulo: $("#pm-titulo").value.trim().toUpperCase() || "PROMOCIÓN", texto: $("#pm-texto").value.trim(), porcentaje: Math.round(Number($("#pm-pct").value)),
      desde: $("#pm-desde").value, hasta: $("#pm-hasta").value, horaFin: $("#pm-hora").value || "", secciones: [...document.querySelectorAll(".pm-sec:checked")].map(x => x.value) };
    if (!(promo.porcentaje > 0 && promo.porcentaje <= 90)) return avisar("El descuento tiene que ser entre 1 y 90 %.");
    if (!promo.desde || !promo.hasta || promo.desde > promo.hasta) return avisar("Revisa las fechas: \"Desde\" tiene que ser antes que \"Hasta\".");
    if (!promo.texto) promo.texto = `${promo.porcentaje}% de descuento${promo.secciones.length ? " en " + menuAdmin.filter(sc => promo.secciones.includes(sc.id)).map(sc => sc.nombre).join(", ") : " en toda la carta"}`;
    return guardarYAvisar(guardarAdmin(["promo"], promo), "🔥 Promoción guardada");
  }
  if (b.dataset.acc === "archivo-apagar") return guardarYAvisar(guardarAdmin(["apagado"], CLAVE_DESCUENTO), "⛔ Promoción apagada");
  if (b.dataset.acc === "archivo-encender") return guardarYAvisar(guardarAdmin(["apagado"], null), "✅ Promoción encendida otra vez");
  if (b.dataset.acc === "promo-quitar") return guardarYAvisar(guardarAdmin(["promo"], null), "Promoción quitada");
  if (b.dataset.acc === "ver-registro") { vista = "registro"; abierto = null; window.scrollTo(0, 0); return pintar(); }
  if (b.dataset.periodo) { const [d, h, t] = periodo(b.dataset.periodo); return cargarRegistro(d, h, t); }
  if (b.dataset.acc === "reg-buscar") return cargarRegistro($("#reg-desde").value, $("#reg-hasta").value, "");
  if (b.dataset.acc === "reg-excel") return descargarRegistro();
  if (b.dataset.dia) { reg.abiertoDia = reg.abiertoDia === b.dataset.dia ? null : b.dataset.dia; return pintar(); }
  if (b.dataset.acc === "todo-disponible") {
    if (!seguroTodo) { seguroTodo = true; return pintar(); }
    seguroTodo = false; agotados = new Set(); pintar();
    guardarAgotados([]).then(() => avisar("✅ Todo disponible")).catch(() => avisar("No se pudo guardar. Revisa el internet."));
    return;
  }
  if (b.dataset.filtro) { filtro = b.dataset.filtro; return pintar(); }
  if (b.dataset.borrar) {   // @@ELIMINAR-RAPIDO: sale de todas las listas, pero sigue en el Registro de ventas
    const pa = pedidos.find(x => x.id === b.dataset.borrar); if (!pa) return;
    if (borrando !== pa.id) { borrando = pa.id; pintar(); setTimeout(() => { if (borrando === pa.id) { borrando = null; pintar(); } }, 4000); return; }
    borrando = null; pa.archivado = true; pa.eliminado = true; pintar();
    actualizarPedido(pa.id, { archivado: true, eliminado: true }).then(() => avisar(`🗑️ #${pa.codigo} eliminado · sigue en el registro de ventas`)).catch(() => avisar("No se pudo guardar. Revisa el internet."));
    return;
  }
  if (b.dataset.arch) {
    const pa = pedidos.find(x => x.id === b.dataset.arch); if (!pa) return;
    pa.archivado = true; pintar();
    actualizarPedido(pa.id, { archivado: true }).then(() => avisar(`🗂️ #${pa.codigo} archivado · queda en el registro`)).catch(() => avisar("No se pudo guardar. Revisa el internet."));
    return;
  }
  if (b.dataset.abrir) { abierto = b.dataset.abrir; window.scrollTo(0, 0); return pintar(); }
  if (b.dataset.min) { minutosSel = +b.dataset.min; return pintar(); }
  const p = pedidos.find(x => x.id === abierto);
  switch (b.dataset.acc) {
    case "sonido": campana(); prepararAvisos(); break;
    case "salir": salir(); break;
    case "volver": abierto = null; pintar(); break;
    case "editar-delivery": editandoDelivery = p.id; pintar(); break;
    case "pedir-ubicacion": responder(p, "¡Hola! Para calcular el delivery, toca el botón 📍 \"Mi ubicación\" aquí en el chat. Así el delivery llega exacto."); avisar("Le pedimos la ubicación por el chat"); break;
    case "fijar-delivery": fijarDelivery(p, b.dataset.monto, b.dataset.km); break;
    case "fijar-delivery-otro": { const v = $("#delivery-otro").value; if (v) fijarDelivery(p, v); break; }
    case "chat-enviar": { const t = $("#pchat-txt"); responder(p, t.value); t.value = ""; break; }
    case "archivar": cambiar(p, { archivado: true }, null, "🗂️ Archivado: sigue contando en las ventas"); abierto = null; break;
    case "desarchivar": cambiar(p, { archivado: false }, null, "↩️ De vuelta en la lista"); break;
    case "eliminar": cambiar(p, { eliminado: true, archivado: true }, null, "🗑️ Quitado de la lista (sigue contando en las ventas)"); abierto = null; break;
    case "prueba":
      if (p.prueba) cambiar(p, { prueba: false, archivado: false }, null, "Ya no está marcado como prueba");
      else { cambiar(p, { prueba: true, archivado: true }, null, "🧪 Marcado como prueba: no cuenta en las ventas"); abierto = null; }
      break;
    case "extra": {   // @@MINUTOS-EXTRA: suma minutos al tiempo de preparación; el cliente lo ve en su pantalla
      const m = +b.dataset.mas, base = Math.max(ms(p.listoEn) || Date.now(), Date.now());
      const listoEn = new Date(base + m * 60000), minutos = (p.minutos || 0) + m;
      cambiar(p, { listoEn, minutos }, { listoEn, minutos }, `+${m} min · el cliente ya ve el tiempo nuevo`);
      break;
    }
    case "aceptar":
      cambiar(p, { estado: "preparando", minutos: minutosSel, listoEn: enMinutos(minutosSel), aceptado: new Date() },
        { estado: "preparando", minutos: minutosSel, listoEn: enMinutos(minutosSel) }, "Aceptado ✅ El cliente ya lo ve en su pantalla");
      if (AVISOS_WA) abrirWA(telWA(p.tel), llenar(MSG.aceptado, p, { min: minutosSel }));
      break;
    case "rechazar": rechazando = p.id; $("#caja-rechazo").hidden = false; $("#motivo").focus(); break;
    case "reembolsado": cambiar(p, { reembolsado: true }, null, "💸 Anotado: dinero devuelto"); break;
    case "no-reembolsado": cambiar(p, { reembolsado: false }, null, "Desmarcado"); break;
    case "confirmar-rechazo": {
      const motivo = $("#motivo").value.trim();
      const cambios = { estado: "rechazado", motivo };
      if (p.pago === "Transferencia" && (p.pagado || comprobanteDe(p))) cambios.porDevolver = true;   // queda anotado para el registro
      cambiar(p, cambios, { estado: "rechazado", motivo }, "Pedido rechazado · el cliente lo ve en su pantalla");
      if (AVISOS_WA) abrirWA(telWA(p.tel), llenar(MSG.rechazado, p, { motivo }));
      break;
    }
    case "listo":
      cambiar(p, { estado: "listo" }, { estado: "listo" }, "Marcado como listo");
      if (p.modo === "delivery") avisarCloudflare(p.id, "listo");   // le suena al delivery aunque tenga la app cerrada
      if (AVISOS_WA && p.modo !== "delivery") abrirWA(telWA(p.tel), llenar(MSG.listoLlevar, p));
      break;
    case "camino":
    { // @@VIAJE: minutos estimados del viaje (3 min por km + 5, entre 10 y 40) para mover el motorcito del cliente
      const viaje = Math.min(40, Math.max(10, Math.round((Number(p.km) || 3) * 3 + 5)));
      const salio = enMinutos(0);
      cambiar(p, { estado: "en_camino", salio, viaje }, { estado: "en_camino", salio, viaje }, "Va en camino");
    }
      if (AVISOS_WA) abrirWA(telWA(p.tel), llenar(MSG.enCamino, p));
      break;
    case "entregado": cambiar(p, { estado: "entregado" }, { estado: "entregado" }, "Pedido entregado"); break;
    case "reabrir": cambiar(p, { estado: "preparando" }, { estado: "preparando" }, "Pedido reabierto"); break;
    case "grupo": abrirWA("", mensajeDelivery(p)); break;
    case "wa": abrirWA(telWA(p.tel), `Hola ${(p.nombre || "").split(/\s+/)[0]}, te escribimos de Jireh Sushi sobre tu pedido #${p.codigo}. `); break;
    case "seguimiento": abrirWA(telWA(p.tel), `Sigue tu pedido #${p.codigo} en vivo aquí: ${enlaceSeguimiento(p.id)}`); break;
    case "d-tomar": cambiar(p, { recogiendo: true, repartidor: nombreUsuario() }, { recogiendo: true }, "✋ Tomado · ve a buscarlo al local"); break;
    case "d-camino": {   // el delivery ya recogió el pedido: sale y el cliente ve el motorcito
      const viaje = Math.min(40, Math.max(10, Math.round((Number(p.km) || 3) * 3 + 5)));
      const salio = enMinutos(0);
      cambiar(p, { estado: "en_camino", salio, viaje, repartidor: nombreUsuario() }, { estado: "en_camino", salio, viaje }, "¡Buen viaje! 🛵");
      break;
    }
    case "d-entregado": cambiar(p, { estado: "entregado", entregado: new Date() }, { estado: "entregado" }, "Pedido entregado ✅"); abierto = null; break;
    case "d-cobrado": cambiar(p, { pagado: !p.pagado }, null, p.pagado ? "Cobro desmarcado" : "Cobrado ✅"); break;
    case "pago":
      if (!p.pagado) { cambiar(p, { pagado: true }, null, "Pago marcado"); if (AVISOS_WA) abrirWA(telWA(p.tel), llenar(MSG.pago, p)); }
      else cambiar(p, { pagado: false }, null, "Pago desmarcado");
      break;
  }
});
</script>
