<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel de pedidos · Jireh Sushi</title>
<!--
  =========================================================
  PANEL DE PEDIDOS (para el negocio) · Kenmake Soluciones
  ---------------------------------------------------------
  - Se abre desde el enlace que llega al final de cada pedido por WhatsApp.
  - Abierto sin enlace (menu/aviso.html) muestra la LISTA DE PEDIDOS DEL DÍA.
  - Los datos del pedido viajan dentro del enlace (después del ?).
  - La lista y los estados se guardan EN ESTE TELÉFONO (localStorage):
    conviene usar siempre el mismo teléfono para el panel.

  Para cambiar algo, busca con Ctrl+F:
  @@AVISOS        Mensajes que se le mandan al cliente
  @@MINUTOS       Opciones de "Llega en … minutos"
  @@DELIVERY-MSG  Mensaje que se manda al grupo de delivery
  @@COLORES       Colores
  =========================================================
-->
<style>
/* @@COLORES */
:root{--fondo:#0E0E0E;--tarjeta:#1A1A1A;--borde:#2E2E2E;--rojo:#E3121B;--rojo-claro:#FF4D55;--texto:#F4F1EC;--suave:#A9A39A;--verde:#25D366}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#2A0E10 0%,var(--fondo) 55%);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;font-size:17px}
.caja{max-width:560px;margin:0 auto;padding:18px 16px 50px}
.cab{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cab img{width:52px;height:52px;border-radius:50%;background:#fff;object-fit:cover}
.cab h1{margin:0;font-size:24px}
.cab small{color:var(--suave);font-size:14px}
.cab .ir{margin-left:auto;color:var(--rojo-claro);font-weight:700;text-decoration:none;font-size:15px;border:1px solid var(--rojo);border-radius:12px;padding:8px 12px;white-space:nowrap}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:18px;padding:16px;margin-bottom:14px}
.fila{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:16px}
.fila span:first-child{color:var(--suave)}
.fila span:last-child{text-align:right;font-weight:600}
.total{font-size:24px;font-weight:800;color:var(--rojo-claro)}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;background:#2A0E10;border:1px solid #5E1A1E;color:#FFB4B8;font-size:13px;font-weight:700;margin:0 6px 8px 0}
.chip.estado{background:#132219;border-color:#1F5B37;color:#7BE3A0}
.items{margin:8px 0 4px;padding-left:20px;color:#E5DFD6;font-size:16px;line-height:1.55}
h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--suave);margin:22px 0 10px}
.botones{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:62px;padding:0 18px;border-radius:16px;border:1px solid var(--borde);background:var(--tarjeta);color:var(--texto);font-size:18px;font-weight:700;text-decoration:none;cursor:pointer;font-family:inherit}
.btn .ok{font-size:14px;font-weight:700;color:var(--verde);opacity:0}
.btn.hecho{border-color:#1F5B37;background:#132219}
.btn.hecho .ok{opacity:1}
.btn.rojo{background:var(--rojo);border-color:var(--rojo);justify-content:center}
.btn.verde{background:#1E7A45;border-color:#1E7A45;justify-content:center}
.btn.borde{background:transparent;justify-content:center}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.minutos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.minutos button{height:52px;border-radius:12px;border:1px solid var(--borde);background:var(--tarjeta);color:var(--texto);font-size:17px;font-weight:700;cursor:pointer}
.minutos button.activo{background:var(--rojo);border-color:var(--rojo)}
textarea{width:100%;min-height:90px;border-radius:14px;border:1px solid var(--borde);background:#121212;color:var(--texto);font:inherit;padding:12px;margin-bottom:10px;resize:vertical}
.enlace{color:var(--rojo-claro);word-break:break-all}
.resumen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.resumen div{background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:14px}
.resumen b{display:block;font-size:26px;color:var(--rojo-claro)}
.resumen small{color:var(--suave);font-size:14px}
.pedido{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--tarjeta);border:1px solid var(--borde);margin-bottom:10px;text-decoration:none;color:inherit}
.pedido .num{font-weight:800;font-size:18px;min-width:70px}
.pedido .info{flex:1;min-width:0}
.pedido .info b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pedido .info small{color:var(--suave);font-size:14px}
.pedido .est{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:#2A0E10;color:#FFB4B8;white-space:nowrap}
.pedido.entregado{opacity:.6}
.pedido.entregado .est{background:#132219;color:#7BE3A0}
.vacio{text-align:center;color:var(--suave);padding:40px 20px}
.aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);white-space:nowrap;background:#132219;border:1px solid #1F5B37;color:#7BE3A0;padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
.aviso.ver{opacity:1}
.pie{text-align:center;color:#6E6862;font-size:13px;margin-top:26px}
</style>
</head>
<body>
<div class="caja" id="app"></div>
<div class="aviso" id="aviso"></div>

<script>
const NEGOCIO = { nombre: "Jireh Sushi", logo: "fotos/logo.png" };

/* ================= @@AVISOS — MENSAJES PARA EL CLIENTE =================
   {nombre} = primer nombre del cliente · {id} = número del pedido · {negocio} = nombre del negocio
   "para": tipo de pedido donde sale el botón · "estado": cómo queda el pedido en la lista */
const AVISOS = [
  { clave: "recibido",   boton: "✅ Pedido recibido",      para: ["delivery","llevar"], estado: "Recibido",       texto: "¡Hola {nombre}! 🍣 Recibimos tu pedido #{id}. Ya lo estamos preparando." },
  { clave: "preparando", boton: "👨‍🍳 En preparación",      para: ["delivery","llevar"], estado: "En preparación", texto: "{nombre}, tu pedido #{id} está en preparación 👨‍🍳 ¡Ya casi!" },
  { clave: "camino",     boton: "🛵 Va en camino",          para: ["delivery"],          estado: "En camino",      texto: "¡{nombre}, tu pedido #{id} va en camino! 🛵 Llega en unos minutos." },
  { clave: "listo",      boton: "🙌 Listo para buscar",     para: ["llevar"],            estado: "Listo",          texto: "¡{nombre}, tu pedido #{id} está listo! 🙌 Puedes pasar a buscarlo." },
  { clave: "pago",       boton: "💰 Pago recibido",        para: ["delivery","llevar"], estado: null,             texto: "¡Gracias {nombre}! Recibimos tu pago del pedido #{id} ✅" },
  { clave: "gracias",    boton: "❤️ Gracias por tu compra", para: ["delivery","llevar"], estado: null,             texto: "¡Gracias por tu compra, {nombre}! Esperamos que lo disfrutes 🍣 ¡Te esperamos pronto en {negocio}!" }
];
/* @@MINUTOS — opciones del botón "Llega en … minutos" */
const MINUTOS = [10, 15, 20, 30, 45];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const q = new URLSearchParams(location.search);
const P = {
  id: q.get("id") || "", nombre: q.get("n") || "", tel: q.get("t") || "", modo: q.get("m") || "llevar",
  items: q.get("i") || "", sub: q.get("s") || "", del: q.get("d") || "", km: q.get("k") || "", total: q.get("tt") || "",
  dir: q.get("dir") || "", ref: q.get("ref") || "", ubic: q.get("u") || "", pago: q.get("p") || "", banco: q.get("b") || "", cambio: q.get("c") || ""
};
const primerNombre = (P.nombre.trim().split(/\s+/)[0] || "");
const rellenar = t => t.replace(/\{nombre\}/g, primerNombre).replace(/\{id\}/g, P.id).replace(/\{negocio\}/g, NEGOCIO.nombre);
function avisar(t){ const a = $("#aviso"); a.textContent = t; a.classList.add("ver"); clearTimeout(avisar.t); avisar.t = setTimeout(() => a.classList.remove("ver"), 2200); }

// Los botones de aviso le escriben AL CLIENTE, al número que él puso en el pedido.
// Los números de RD tienen 10 dígitos; WhatsApp necesita el 1 delante.
function telWA(t){ let n = String(t).replace(/\D/g, ""); if (n.length === 10) n = "1" + n; return n; }
const esCelular = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
function abrirWA(numero, texto){
  const base = esCelular ? "https://api.whatsapp.com/send" : "https://web.whatsapp.com/send";
  const url = `${base}?${numero ? "phone=" + numero + "&" : ""}text=${encodeURIComponent(texto)}`;
  if (esCelular) location.href = url; else window.open(url, "_blank");
}

/* ================= LISTA DE PEDIDOS (guardada en este teléfono) ================= */
const CLAVE_LISTA = "jireh-pedidos";
const hoy = () => new Date().toISOString().slice(0, 10);
const numero = t => { const m = String(t).replace(/,/g, "").match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : 0; };   // "RD$ 1,760" -> 1760
function leerLista(){ try { return JSON.parse(localStorage.getItem(CLAVE_LISTA) || "[]"); } catch(e) { return []; } }
function guardarLista(l){ try { localStorage.setItem(CLAVE_LISTA, JSON.stringify(l.slice(-300))); } catch(e) {} }
function pedidoActual(){ return leerLista().find(x => x.id === P.id); }
function actualizar(cambios){
  const l = leerLista(); const i = l.findIndex(x => x.id === P.id);
  if (i >= 0) { l[i] = { ...l[i], ...cambios }; guardarLista(l); }
}
// Al abrir un pedido por primera vez, se agrega a la lista
if (P.id && P.nombre && !pedidoActual()) {
  const l = leerLista();
  l.push({ id: P.id, nombre: P.nombre, modo: P.modo, total: P.total, monto: numero(P.total), fecha: hoy(),
           hora: new Date().toLocaleTimeString("es-DO", { hour: "numeric", minute: "2-digit" }), estado: "Nuevo", hechos: {}, url: location.href });
  guardarLista(l);
}

/* ================= @@DELIVERY-MSG — MENSAJE PARA EL GRUPO DE DELIVERY ================= */
function mensajeDelivery(){
  let m = `🛵 *PEDIDO #${P.id}* — ${NEGOCIO.nombre}\n\n`;
  m += `Cliente: ${P.nombre}\nTeléfono: ${P.tel}\n`;
  m += `Dirección: ${P.dir}${P.ref ? `\nReferencia: ${P.ref}` : ""}\n`;
  if (P.ubic) m += `Ubicación: https://maps.google.com/?q=${P.ubic}\n`;
  if (P.km) m += `Distancia aprox.: ${P.km} km\n`;
  m += `\n${P.items.split(";").map(x => "• " + x.trim()).join("\n")}\n\n`;
  if (P.pago === "Efectivo") m += `💵 *COBRAR: ${P.total}* en efectivo${P.cambio ? ` (paga con ${P.cambio})` : ""}`;
  else m += `✅ Pago por transferencia${P.banco ? ` (${P.banco})` : ""}: verificar comprobante antes de salir`;
  m += `\n\nResponde "Lo tomo ✋" si vas tú.`;
  return m;
}
/* Texto completo del pedido, para el botón "Copiar datos" */
function textoPedido(){
  let m = `Pedido #${P.id} · ${P.modo === "delivery" ? "Delivery" : "Para llevar"}\n`;
  m += `Cliente: ${P.nombre} · ${P.tel}\n`;
  if (P.modo === "delivery") { m += `Dirección: ${P.dir}${P.ref ? ` (${P.ref})` : ""}\n`; if (P.ubic) m += `Mapa: https://maps.google.com/?q=${P.ubic}\n`; }
  m += P.items.split(";").map(x => "• " + x.trim()).join("\n") + "\n";
  if (P.modo === "delivery") m += `Subtotal: ${P.sub} · Delivery: ${P.del || "por confirmar"}\n`;
  m += `Total: ${P.total} · Pago: ${P.pago}${P.banco ? " (" + P.banco + ")" : ""}${P.cambio ? " · paga con " + P.cambio : ""}`;
  return m;
}
function copiar(t){
  const listo = () => avisar("Datos copiados ✓");
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(listo, () => { prompt("Copia el texto:", t); });
  else prompt("Copia el texto:", t);
}

let minutosSel = 20;

/* ================= PANTALLA: LISTA DE PEDIDOS DEL DÍA ================= */
function pintarLista(){
  const delDia = leerLista().filter(x => x.fecha === hoy()).reverse();
  const entregados = delDia.filter(x => x.estado === "Entregado");
  const vendido = entregados.reduce((s, x) => s + (x.monto || 0), 0);
  $("#app").innerHTML = `
    <div class="cab"><img src="${NEGOCIO.logo}" alt=""><div><h1>Pedidos de hoy</h1><small>${esc(NEGOCIO.nombre)} · Panel de pedidos</small></div></div>
    <div class="resumen">
      <div><b>${delDia.length}</b><small>Pedidos hoy</small></div>
      <div><b>RD$ ${vendido.toLocaleString("en-US")}</b><small>Vendido (entregados: ${entregados.length})</small></div>
    </div>
    ${delDia.length ? delDia.map(x => `<a class="pedido${x.estado === "Entregado" ? " entregado" : ""}" href="${esc(x.url)}">
        <span class="num">#${esc(x.id)}</span>
        <span class="info"><b>${esc(x.nombre)}</b><small>${x.modo === "delivery" ? "🛵 Delivery" : "🥡 Para llevar"} · ${esc(x.hora)} · ${esc(x.total)}</small></span>
        <span class="est">${esc(x.estado)}</span></a>`).join("")
      : `<div class="vacio">Todavía no hay pedidos hoy.<br>Cada pedido aparece aquí cuando abres su enlace del WhatsApp.</div>`}
    ${delDia.length ? `<div class="botones" style="margin-top:18px"><button class="btn borde" data-acc="borrar">🗑️ Borrar la lista de hoy</button></div>` : ""}
    <div class="pie">La lista se guarda en este teléfono. Usa siempre el mismo para el panel.<br>Kenmake Soluciones</div>`;
}

/* ================= PANTALLA: UN PEDIDO ================= */
function pintarPedido(){
  const ped = pedidoActual() || { hechos: {}, estado: "Nuevo" };
  const hechos = ped.hechos || {};
  const lista = AVISOS.filter(a => a.para.includes(P.modo));
  const entregado = ped.estado === "Entregado";
  $("#app").innerHTML = `
    <div class="cab"><img src="${NEGOCIO.logo}" alt=""><div><h1>Pedido #${esc(P.id)}</h1><small>${esc(NEGOCIO.nombre)}</small></div>
      <a class="ir" href="aviso.html">📋 Pedidos de hoy</a></div>
    <div class="tarjeta">
      <span class="chip">${P.modo === "delivery" ? "🛵 DELIVERY" : "🥡 PARA LLEVAR"}</span><span class="chip estado">${esc(ped.estado)}</span>
      <div class="fila"><span>Cliente</span><span>${esc(P.nombre)}</span></div>
      <div class="fila"><span>Teléfono</span><span>${esc(P.tel)}</span></div>
      ${P.modo === "delivery" ? `<div class="fila"><span>Dirección</span><span>${esc(P.dir)}</span></div>
      ${P.ref ? `<div class="fila"><span>Referencia</span><span>${esc(P.ref)}</span></div>` : ""}
      ${P.ubic ? `<div class="fila"><span>Ubicación</span><span><a class="enlace" href="https://maps.google.com/?q=${esc(P.ubic)}" target="_blank" rel="noopener">Ver en el mapa</a></span></div>` : ""}` : ""}
      <div class="fila"><span>Pago</span><span>${esc(P.pago)}${P.banco ? " · " + esc(P.banco) : ""}${P.cambio ? " · paga con " + esc(P.cambio) : ""}</span></div>
      <ul class="items">${P.items.split(";").filter(Boolean).map(x => `<li>${esc(x.trim())}</li>`).join("")}</ul>
      ${P.modo === "delivery" ? `<div class="fila"><span>Subtotal</span><span>${esc(P.sub)}</span></div><div class="fila"><span>Delivery${P.km ? " (" + esc(P.km) + " km)" : ""}</span><span>${esc(P.del || "Por confirmar")}</span></div>` : ""}
      <div class="fila"><span>Total</span><span class="total">${esc(P.total)}</span></div>
    </div>

    <h2>Avisar al cliente · se abre su WhatsApp (${esc(P.tel)})</h2>
    <div class="botones">
      ${lista.map(a => `<button class="btn${hechos[a.clave] ? " hecho" : ""}" data-aviso="${a.clave}"><span>${a.boton}</span><span class="ok">✓ Enviado</span></button>`).join("")}
    </div>

    <h2>Tiempo de llegada</h2>
    <div class="minutos">${MINUTOS.map(m => `<button class="${m === minutosSel ? "activo" : ""}" data-min="${m}">${m}</button>`).join("")}</div>
    <div class="botones"><button class="btn${hechos.minutos ? " hecho" : ""}" data-acc="minutos"><span>⏱️ ${P.modo === "delivery" ? "Llega" : "Listo"} en ${minutosSel} minutos</span><span class="ok">✓ Enviado</span></button></div>

    <h2>Mensaje propio</h2>
    <textarea id="propio" placeholder="Escribe aquí lo que quieras decirle al cliente…"></textarea>
    <div class="botones"><button class="btn" data-acc="propio">✉️ Enviar mi mensaje</button></div>

    ${P.modo === "delivery" ? `<h2>Delivery</h2>
    <div class="botones"><button class="btn rojo${hechos.delivery ? " hecho" : ""}" data-acc="delivery">📤 Enviar al grupo de delivery</button></div>` : ""}

    <h2>Más</h2>
    <div class="dos">
      <a class="btn borde" href="tel:${esc(P.tel.replace(/\D/g, ""))}">📞 Llamar</a>
      <button class="btn borde" data-acc="copiar">📋 Copiar datos</button>
    </div>
    <div class="botones" style="margin-top:10px">
      ${entregado ? `<button class="btn borde" data-acc="reabrir">↩️ Marcar como no entregado</button>`
                  : `<button class="btn verde" data-acc="entregado">✔️ Pedido entregado</button>`}
    </div>
    <div class="pie">Los botones de aviso abren WhatsApp con el mensaje listo: solo toca enviar.<br>Kenmake Soluciones</div>`;
}

function pintar(){ if (P.id && P.nombre) pintarPedido(); else pintarLista(); }

function marcarHecho(clave, estado){
  const ped = pedidoActual(); if (!ped) return;
  const hechos = { ...(ped.hechos || {}), [clave]: true };
  actualizar(estado ? { hechos, estado } : { hechos });
}

document.addEventListener("click", e => {
  const m = e.target.closest("[data-min]");
  if (m) { minutosSel = Number(m.dataset.min); pintar(); return; }
  const b = e.target.closest("[data-aviso],[data-acc]"); if (!b) return;
  if (b.dataset.aviso) {
    const a = AVISOS.find(x => x.clave === b.dataset.aviso);
    marcarHecho(a.clave, a.estado); pintar();
    abrirWA(telWA(P.tel), rellenar(a.texto));
    return;
  }
  switch (b.dataset.acc) {
    case "minutos": {
      const t = P.modo === "delivery" ? `¡${primerNombre}, tu pedido #${P.id} llega en aproximadamente ${minutosSel} minutos! 🛵` : `${primerNombre}, tu pedido #${P.id} estará listo en aproximadamente ${minutosSel} minutos 🍣`;
      marcarHecho("minutos", null); pintar(); abrirWA(telWA(P.tel), t); break;
    }
    case "propio": {
      const t = $("#propio").value.trim();
      if (!t) { avisar("Escribe el mensaje primero"); return; }
      abrirWA(telWA(P.tel), t); break;
    }
    case "delivery": marcarHecho("delivery", P.modo === "delivery" ? "En camino" : null); pintar(); abrirWA("", mensajeDelivery()); break;
    case "copiar": copiar(textoPedido()); break;
    case "entregado": actualizar({ estado: "Entregado" }); pintar(); avisar("Pedido entregado ✓"); break;
    case "reabrir": actualizar({ estado: "En preparación" }); pintar(); break;
    case "borrar":
      if (confirm("¿Borrar la lista de pedidos de hoy?")) { guardarLista(leerLista().filter(x => x.fecha !== hoy())); pintar(); }
      break;
  }
});
pintar();
</script>
</body>
</html>
